# Start window numbering at 1
set-option -g base-index 1
set-window-option -g pane-base-index 1

# remap prefix to Control + a
set -g prefix C-a
# bind 'C-a C-a' to type 'C-a'
bind C-a send-prefix
unbind C-b

# Reload config with a key
bind-key r source-file ~/.tmux.conf \; display "Config reloaded!"

# Terminal type and colour.
# tmux-256color advertises the right capabilities (italics, proper sgr);
# screen-256color is the older, more limited entry. If a machine lacks the
# tmux-256color terminfo entry, fall back with:
#   infocmp -x tmux-256color > /tmp/t && tic -x /tmp/t
set -g default-terminal "tmux-256color"
# Let truecolor through from any outer terminal that supports it.
set -sa terminal-features ',*:RGB'

# Do not swallow the Escape key. The default 500ms delay is what makes <Esc>
# feel laggy inside vim; 10ms is still ample for real escape sequences.
set -sg escape-time 10

# Report focus changes to applications: this is what drives the vimrc's
# save-on-leave and reload-on-return around an agent editing the same files.
# Necessary but not sufficient -- vim also has to ask for focus reporting,
# which it does not do for term=tmux-256color on its own; the vimrc sets t_fe
# and t_fd by hand for that. Neovim asks for itself.
set -g focus-events on

# Mouse works as expected (tmux >= 2.1). The value is not optional: a flag
# option set with no value *toggles*, so a bare `set -g mouse` turns the mouse
# off on the first `prefix r` and back on with the next one -- which shows up
# as scrolling mysteriously breaking after a config reload.
set -g mouse on

# Clear the pane and its scrollback. C-k is taken by pane navigation below,
# so this lives behind the prefix.
bind-key k send-keys C-l \; clear-history

# --- Smart pane switching with awareness of Vim splits ---------------------
# Provided by vim/bundle/vim-tmux-navigator; this is that plugin's own
# recommended snippet. It inspects the pane's process state rather than
# grepping #{pane_current_command}, so it also does the right thing for fzf
# and for wrapped or full-path vim invocations.
vim_pattern='(\S+/)?g?\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?'
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +${vim_pattern}$'"

bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'
bind-key -n 'C-\' if-shell "$is_vim" 'send-keys C-\\' 'select-pane -l'

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l

# C-l is taken over by pane navigation, so keep a way to send a literal one.
bind C-l send-keys 'C-l'

# --- Copy mode -------------------------------------------------------------
setw -g mode-keys vi

# Pick a clipboard backend once, at config load, and let both copy bindings
# inherit it via copy-command (tmux >= 3.2). Later matches win, so the order
# is least- to most-preferred. tmux runs these through a non-interactive
# `sh -c`, so a shell alias would not be visible here -- it has to be a real
# executable. Falls back to tmux's internal buffer if none are present.
if-shell 'command -v xclip'   'set -s copy-command "xclip -selection clipboard -i"'
if-shell 'command -v wl-copy' 'set -s copy-command "wl-copy"'
if-shell 'command -v pbcopy'  'set -s copy-command "pbcopy"'

bind-key -T copy-mode-vi 'v'   send-keys -X begin-selection
bind-key -T copy-mode-vi 'y'   send-keys -X copy-pipe-and-cancel
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel

# Increase per pane buffer size
set-option -g history-limit 10000

# --- Coding agent in another pane ------------------------------------------
# The other half of vim/plugin/agent.vim: keys for driving a coding agent
# (Claude Code and friends) that lives in its own pane. All of them go through
# ~/bin/agent-pane, which createLinks.sh links from scripts/agent-pane.sh --
# run `agent-pane --help` for the full set, including the shell-side uses
# (`pytest 2>&1 | agent-pane send -F -` and so on).
#
# What to run, and how to split for it. These are tmux options rather than
# environment variables on purpose: run-shell inherits the tmux *server*
# environment, which is whatever your login shell looked like when the server
# started -- not what your current shell exports.
set -g @agent_cmd 'claude'
set -g @agent_split 'auto'   # 'auto' = beside if the window is wide, else below

# run-shell sets TMUX but not TMUX_PANE (it has no pane of its own), so the
# pane that pressed the key is passed in explicitly.
#
#   prefix a   open the agent pane, or jump to it if it is already there
#   prefix A   mark this pane as the agent -- for one started by hand, or a
#              second one, or an agent running over ssh in a pane
#   prefix P   paste this pane's last 200 lines into the agent: the failing
#              test run, the traceback, the log you are staring at
bind-key a run-shell -b 'SELF_PANE=#{pane_id} ~/bin/agent-pane focus'
bind-key A run-shell -b 'SELF_PANE=#{pane_id} ~/bin/agent-pane mark'
bind-key P run-shell -b 'SELF_PANE=#{pane_id} ~/bin/agent-pane output -f'

# And in copy mode, Y sends the selection instead of the whole screen -- select
# the six lines that matter in a thousand-line log and hand over just those.
bind-key -T copy-mode-vi 'Y' send-keys -X copy-pipe-and-cancel '~/bin/agent-pane send -F -f -'
