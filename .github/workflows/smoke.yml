name: smoke

# Does a clean install work, and does everything still start?
#
# The bar differs per release. On 22.04 and 24.04 a startup error fails the
# build. On 20.04 it only has to start -- that release is old enough that
# partial breakage is accepted, so errors there are reported, not fatal.
#
# All three run as containers: GitHub retired the ubuntu-20.04 hosted runner
# in 2025, and containers keep the three jobs identical anyway.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  install:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ubuntu:24.04
            strict: true
          - image: ubuntu:22.04
            strict: true
          - image: ubuntu:20.04
            strict: false
    defaults:
      run:
        shell: bash
    env:
      DEBIAN_FRONTEND: noninteractive
      TERM: xterm

    steps:
      # ncurses-term is deliberately NOT installed: it is what supplies the
      # tmux-256color entry on Ubuntu, and with it present the carried terminfo
      # fallback never fires and goes untested. A bare container without it is
      # also the realistic minimal-server case.
      #
      # git has to exist before actions/checkout, or it silently falls back to
      # a tarball download and the submodules never arrive.
      - name: Prerequisites
        run: |
          set -eux
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates git vim neovim tmux ncurses-bin xclip
          # Not packaged identically across releases; the dep check reports it.
          apt-get install -y --no-install-recommends universal-ctags || true

          # The checkout is owned by a different uid than the container root,
          # so any git command in the repo trips the dubious-ownership guard.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

          # neovim registers itself as the `vim` alternative and wins, so a
          # bare `vim` is actually nvim and real Vim never gets tested.
          if [ -x /usr/bin/vim.basic ]; then
            update-alternatives --set vim /usr/bin/vim.basic || true
          fi
          echo "VIM_BIN=$([ -x /usr/bin/vim.basic ] && echo /usr/bin/vim.basic || command -v vim)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install
        run: ./createLinks.sh --no-fonts

      - name: Versions
        run: |
          {
            echo "## ${{ matrix.image }}"
            echo '```'
            echo "vim    $("$VIM_BIN" --version | head -1)  [$VIM_BIN]"
            echo "nvim   $(nvim --version | head -1)"
            echo "tmux   $(tmux -V)"
            echo "bash   $BASH_VERSION"
            echo "glibc  $(ldd --version | head -1)"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: terminfo
        run: |
          set -eu
          if infocmp tmux-256color >/dev/null 2>&1; then
            echo "tmux-256color resolves: $(tput -T tmux-256color colors) colors"
          else
            echo "FAIL: tmux-256color still missing after install" >&2
            exit 1
          fi
          if [ -e "$HOME/.terminfo" ]; then
            src='compiled from the repo copy'
          else
            src='already supplied by the system'
          fi
          { echo "- terminfo: tmux-256color resolves, $(tput -T tmux-256color colors) colors ($src)"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: vim starts
        run: |
          set -eu
          printf 'int main(void){return 0;}\n' > /tmp/t.c
          # guard against nvim masquerading as vim again
          "$VIM_BIN" --version | head -1 | grep -q '^VIM - Vi IMproved'
          "$VIM_BIN" --not-a-term -c 'redir! > /tmp/vim.msg' -c 'silent messages' \
              -c 'redir END' -c 'qa!' /tmp/t.c < /dev/null > /dev/null
          echo "--- :messages ---"; cat /tmp/vim.msg
          if grep -qE '^E[0-9]+:' /tmp/vim.msg; then
            echo "- vim: startup errors" | tee -a "$GITHUB_STEP_SUMMARY"
            grep -E '^E[0-9]+:' /tmp/vim.msg | sed 's/^/  - `/;s/$/`/' | tee -a "$GITHUB_STEP_SUMMARY"
            if [ "${{ matrix.strict }}" = "true" ]; then exit 1; fi
          else
            echo "- vim: starts clean" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: nvim starts
        run: |
          set -eu
          nvim --headless -c 'qa!' /tmp/t.c < /dev/null 2> /tmp/nvim.msg
          echo "--- stderr ---"; cat /tmp/nvim.msg
          if grep -qE 'E[0-9]+:' /tmp/nvim.msg; then
            echo "- nvim: startup errors" | tee -a "$GITHUB_STEP_SUMMARY"
            grep -oE 'E[0-9]+:[^"]*' /tmp/nvim.msg | sed 's/^/  - `/;s/$/`/' | tee -a "$GITHUB_STEP_SUMMARY"
            if [ "${{ matrix.strict }}" = "true" ]; then exit 1; fi
          else
            echo "- nvim: starts clean" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      # The interesting one. An unknown *option* is skipped and the config
      # continues; an unknown *command* aborts the rest of it. This reports
      # which settings actually survived, which is how we find out how much of
      # tmux.conf a given tmux version applies.
      - name: tmux starts, and what survived
        run: |
          set -eu
          tmux -f "$PWD/tmux.conf" new-session -d -s ci
          tmux has-session -t ci
          hl=$(tmux show-options  -gv history-limit  2>/dev/null || echo '(unset)')
          mk=$(tmux show-window-options -gv mode-keys 2>/dev/null || echo '(unset)')
          cc=$(tmux show-options  -sv copy-command   2>/dev/null || echo '(unsupported)')
          tf=$(tmux show-options  -sv terminal-features 2>/dev/null || echo '(unsupported)')
          nav=$(tmux list-keys -T root 2>/dev/null | grep -c "select-pane -L" || true)
          # The agent section is the last thing in the file, so this is the
          # real "config read to the end" marker now.
          ac=$(tmux show-options -gv @agent_cmd 2>/dev/null || echo '(unset)')
          ag=$(tmux list-keys -T prefix 2>/dev/null | grep -c "agent-pane" || true)
          {
            echo "- tmux: session created"
            echo "  - history-limit (line 79)      \`$hl\`"
            echo "  - mode-keys (line 63)          \`$mk\`"
            echo "  - copy-command (3.2+)          \`$cc\`"
            echo "  - terminal-features (3.2+)     \`${tf:-(empty)}\`"
            echo "  - pane-nav bindings bound      \`$nav\`"
            echo "  - @agent_cmd (last section)    \`$ac\`  (set = config read to the end)"
            echo "  - agent bindings bound         \`$ag\`"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          tmux kill-server 2>/dev/null || true

      # Does handing context to the agent pane actually work on this tmux?
      # The stand-in agent is `cat`, so whatever the pane is sent lands in a
      # file we can grep -- the same path vim and the prefix bindings use.
      - name: agent-pane round trip
        run: |
          set -eu
          out="$HOME/agent.out"
          rm -f "$out"
          tmux -f "$PWD/tmux.conf" new-session -d -s ag -x 200 -y 50
          tmux set-option -g @agent_cmd "cat > $out"
          p=$(tmux list-panes -t ag -F '#{pane_id}')

          # run-shell is what the prefix bindings use, and it sets TMUX but
          # not TMUX_PANE -- hence SELF_PANE, exactly as tmux.conf passes it.
          tmux run-shell -t "$p" "SELF_PANE=$p $HOME/bin/agent-pane open"
          sleep 2
          panes=$(tmux list-panes -t ag | wc -l)
          tmux run-shell -t "$p" \
            "printf 'ci probe\n' | SELF_PANE=$p $HOME/bin/agent-pane send -F -L text -H 'from ci:' -"
          sleep 2
          tmux kill-session -t ag 2>/dev/null || true

          echo "--- what the agent pane received ---"; cat "$out" 2>/dev/null || true
          if [ "$panes" -eq 2 ] && grep -q 'ci probe' "$out" 2>/dev/null; then
            echo "- agent-pane: pane opened and received the paste" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "- agent-pane: FAILED (panes=$panes)" | tee -a "$GITHUB_STEP_SUMMARY"
            if [ "${{ matrix.strict }}" = "true" ]; then exit 1; fi
          fi

      - name: Re-run install (idempotence)
        run: |
          set -eu
          ./createLinks.sh --no-fonts | tee /tmp/second.log
          grep -qE 'already correct' /tmp/second.log
          if grep -qE '^\s+linked ' /tmp/second.log; then
            echo "FAIL: second run still created links" >&2; exit 1
          fi
          echo "- installer: idempotent on re-run" | tee -a "$GITHUB_STEP_SUMMARY"
